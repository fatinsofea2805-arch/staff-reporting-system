<VirtualHost *:10000>
    ServerName localhost
    DocumentRoot /var/www/html
    DirectoryIndex homepage.html
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /var/www/html/data>
        Require all denied
    </Directory>
    <Directory /var/www/html/deploy>
        Require all denied
    </Directory>
    <Directory /var/www/html/Mail>
        Require all denied
    </Directory>
    <Directory /var/data/uploads>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        <FilesMatch "(?i)\.(php[0-9]*|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <FilesMatch "(?i)(^\.|\.(sqlite(-[a-z]+)?|db|sql|bat|md|ini|log|ya?ml|sh|conf)$|^(Dockerfile|connection\.php|database\.php|router\.php)$)">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
